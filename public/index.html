<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Concurrent Quiz — Competitive Math</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <!-- ── name prompt overlay ──────────────────────────────────────── -->
  <div id="name-overlay" class="overlay">
    <div class="overlay-card">
      <h1>⚡ Concurrent Quiz</h1>
      <p>Enter your name to join the competition</p>
      <form id="name-form">
        <input
          id="name-input"
          type="text"
          placeholder="Your name"
          maxlength="20"
          autocomplete="off"
          required
        />
        <button type="submit">Join</button>
      </form>
    </div>
  </div>

  <!-- ── main quiz interface ──────────────────────────────────────── -->
  <div id="app" class="hidden">

    <header>
      <h1>⚡ Concurrent Quiz</h1>
      <span id="player-name-badge" class="badge"></span>
    </header>

    <main>
      <!-- question area -->
      <section id="question-section">
        <p class="label">Round <span id="round-number">—</span></p>
        <div id="question-display" class="question">Waiting for question…</div>

        <form id="answer-form">
          <input
            id="answer-input"
            type="number"
            placeholder="Your answer"
            autocomplete="off"
            required
          />
          <button id="submit-btn" type="submit">Submit</button>
        </form>

        <div id="feedback" class="feedback"></div>
      </section>

      <!-- status banner (winner / countdown) -->
      <section id="status-section" class="hidden">
        <div id="status-message"></div>
        <div id="countdown"></div>
      </section>

      <!-- all-time top 3 dashboard -->
      <section id="top-scores-section">
        <h2><span class="trophy">&#x1F3C6;</span> All-Time Top 3</h2>
        <ol id="top-scores-list">
          <li class="placeholder">No scores yet…</li>
        </ol>
      </section>
    </main>

    <!-- scoreboard -->
    <aside id="scoreboard-section">
      <h2>Scoreboard</h2>
      <ol id="scoreboard-list"></ol>
      <p id="player-count" class="meta"></p>
    </aside>
  </div>

  <!-- Socket.IO client served automatically by the socket.io package -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
